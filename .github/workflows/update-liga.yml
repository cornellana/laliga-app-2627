name: Actualizar datos de La Liga 26/27

on:
  schedule:
    # Cada 15 minutos (máxima frecuencia en GitHub Actions)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Forzar reproceso de todos los partidos finalizados"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --quiet requests

      - name: Actualizar JSON desde ESPN
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: python3 scripts/update_liga.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/laliga2627.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore: actualización automática LaLiga $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
