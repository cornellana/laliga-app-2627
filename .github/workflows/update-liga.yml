name: Actualizar datos de La Liga 26/27

# SUPLENTE. Desde el 22/08/26 el titular es el NAS (contenedor laliga-updater),
# que actualiza cada 60 s durante los partidos con su propio reloj. Este
# workflow ya no publica salvo que el NAS se calle: cada ejecución mira primero
# cuándo se publicaron los datos por última vez y, si son recientes, sale en
# segundos sin tocar nada. Si el NAS lleva rato mudo —corte de luz, de fibra, o
# el contenedor caído— toma el relevo con el bucle de siempre.
#
# Sigue disparando cada 15 minutos y no cada hora a propósito: cuando no hay
# nada que hacer cuesta unos segundos, y así el hueco máximo sin cobertura, si
# el NAS muere en pleno partido, es de minutos y no de una hora.
#
# El cron de GitHub es el despertador, no el reloj: no baja de 5 minutos y en
# la práctica llega tarde (se han medido intervalos de 16 a 39 min). Por eso,
# cuando le toca actuar, se queda en bucle en vez de terminar y esperar al
# siguiente disparo.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Forzar reproceso de todos los partidos finalizados"
        type: boolean
        default: false

permissions:
  contents: write

# Evita que dos ejecuciones se pisen al hacer push. GitHub mantiene como mucho
# una en cola, así que no se acumulan.
concurrency:
  group: update-liga
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      # Si los datos publicados son más recientes que esto, el titular está vivo
      # y aquí no hay nada que hacer. 15 minutos deja margen sobre el ciclo en
      # reposo del NAS, que es de 10.
      RELEVO_MINUTOS: 15
      # Intervalo entre actualizaciones mientras hay partidos
      LIVE_INTERVAL_SECONDS: 180
      # Margen previo al saque para considerar un partido "activo". Tiene que
      # ser mayor que el retraso habitual del cron de GitHub: el 21/08/26 no
      # hubo ninguna ejecución entre las 18:35 y las 19:14, así que la ventana
      # de 20 minutos anterior al Betis-Real Sociedad no se miró nunca y el
      # partido empezó sin cobertura.
      PRE_MATCH_MINUTES: 45
      # Duración máxima del bucle. Algo por encima del cron para cubrir sus
      # retrasos: si se solapan, la concurrencia encadena una tras otra.
      LOOP_MAX_SECONDS: 1500
      # OJO: ACTIVE_FLAG_FILE se define dentro del paso, no aquí. El contexto
      # `runner` no existe en el env del job y usarlo invalida el workflow
      # entero: el run falla antes de crear siquiera el job.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --quiet requests

      - name: Actualizar y publicar mientras haya partidos
        env:
          INPUT_FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          set -uo pipefail
          export ACTIVE_FLAG_FILE="${RUNNER_TEMP:-/tmp}/laliga_active"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ¿Sigue vivo el titular? Se mira la marca del propio JSON publicado.
          # Un disparo manual (workflow_dispatch) se salta la comprobación: si
          # lo lanzas a mano es porque quieres que actúe.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            EDAD=$(python3 scripts/edad_datos.py)
            if [ "$EDAD" -lt "$RELEVO_MINUTOS" ]; then
              echo "Los datos son de hace $EDAD min: el titular sigue vivo, no hago nada."
              exit 0
            fi
            echo "Los datos tienen $EDAD min (umbral: $RELEVO_MINUTOS). El titular no responde: tomo el relevo."
          fi

          DEADLINE=$(( $(date +%s) + LOOP_MAX_SECONDS ))
          CICLO=0

          while true; do
            CICLO=$(( CICLO + 1 ))
            echo "──────── ciclo $CICLO ($(date -u +'%H:%M:%S') UTC) ────────"

            # Cada ciclo arranca desde el remoto. Si el push anterior se cruzó
            # con otra ejecución, se descarta el intento y se vuelve a generar:
            # el JSON se reconstruye entero desde ESPN, así que no hay nada que
            # conservar. Antes esto se resolvía con `git pull --rebase`, que al
            # chocar dejaba el repo en mitad de un rebase —HEAD suelto y
            # marcadores de conflicto dentro del JSON— y el updater ya no podía
            # leer el fichero: el 21/08/26 una ejecución estuvo 24 minutos
            # dando vueltas sin publicar nada, en plena primera parte, y encima
            # ocupando el turno de concurrencia para que nadie más publicara.
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git checkout -q -B main origin/main

            # El reproceso forzado solo tiene sentido en la primera pasada
            if [ "$CICLO" -eq 1 ]; then
              export FORCE_REFRESH="$INPUT_FORCE_REFRESH"
            else
              export FORCE_REFRESH=false
            fi

            if ! python3 scripts/update_liga.py; then
              echo "⚠️  El updater ha fallado en este ciclo; se reintenta en el siguiente."
            fi

            git add data/laliga2627.json
            if git diff --cached --quiet; then
              echo "Sin cambios que publicar."
            else
              git commit -q -m "chore: actualización automática LaLiga $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              if ! git push -q; then
                echo "Push rechazado: otra ejecución se adelantó. El siguiente ciclo lo republica sobre el remoto."
              fi
            fi

            if [ ! -f "$ACTIVE_FLAG_FILE" ]; then
              echo "No hay partidos activos. Fin de la ejecución."
              break
            fi

            if [ $(( $(date +%s) + LIVE_INTERVAL_SECONDS )) -ge "$DEADLINE" ]; then
              echo "Fin de la ventana de esta ejecución; continúa el siguiente cron."
              break
            fi

            echo "Partidos en juego → siguiente actualización en ${LIVE_INTERVAL_SECONDS}s"
            sleep "$LIVE_INTERVAL_SECONDS"
          done

          echo "Ciclos ejecutados: $CICLO"
