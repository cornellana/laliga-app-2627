# Actualizador de La Liga en el NAS. Vive al lado de laliga-api, con el mismo
# estilo: su carpeta en /share/Container, su volumen de datos y restart: always
# para que vuelva solo tras un reinicio o un corte de luz.
#
#   Arrancar:   docker compose up -d --build
#   Ver el log: docker logs -f laliga-updater
#   Parar:      docker compose down
services:
  laliga-updater:
    build: .
    container_name: laliga-updater
    restart: always
    environment:
      # sombra    = genera datos y los compara con lo publicado, SIN publicar.
      # produccion = publica él (y entonces hay que decidir qué hace el workflow).
      LALIGA_MODO: "${LALIGA_MODO:-sombra}"
      LALIGA_REPO: /repo
      LALIGA_ESTADO_DIR: /estado
      LALIGA_DATOS: /estado/laliga2627.json
      LALIGA_INTERVALO_VIVO: "${LALIGA_INTERVALO_VIVO:-60}"
      LALIGA_INTERVALO_REPOSO: "${LALIGA_INTERVALO_REPOSO:-600}"
      PRE_MATCH_MINUTES: "45"
    volumes:
      # El estado (datos de trabajo, log, marca de vida) sobrevive a que se
      # recree el contenedor. El clon del repositorio también, para no volver a
      # descargarlo en cada arranque.
      - /share/Container/laliga-updater/estado:/estado
      - /share/Container/laliga-updater/repo:/repo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
